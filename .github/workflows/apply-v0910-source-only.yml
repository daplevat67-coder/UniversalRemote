name: Apply v0.9.10 source-only patch

on:
  push:
    branches: [ fix/v0.9.10-bluetooth-classic ]
    paths:
      - ".github/workflows/apply-v0910-source-only.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: fix/v0.9.10-bluetooth-classic

      - name: Reuse validated source patch
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, re, subprocess
          from pathlib import Path
          text = Path('.github/workflows/apply-v0910-classic.yml').read_text()
          m = re.search(r"echo '([A-Za-z0-9+/=]+)' \| base64 -d", text)
          if not m:
              raise SystemExit('encoded patch payload not found')
          Path('/tmp/patch.py').write_bytes(base64.b64decode(m.group(1)))
          subprocess.run(['python3', '/tmp/patch.py'], check=True)
          subprocess.run(['git', 'checkout', '--', '.github/workflows/build-apk.yml'], check=True)
          PY

      - name: Commit source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "UniversalRemote CI"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/java/com/example/universalremote/MainActivity.kt app/build.gradle.kts companion/build.gradle.kts
          git commit -m "Fix Bluetooth Classic pairing flow in v0.9.10"
          git push origin HEAD:fix/v0.9.10-bluetooth-classic
