name: Apply v0.9.9 BLE GATT integration

on:
  push:
    branches: [ feature/v0.9.9-ble-gatt ]
    paths:
      - ".github/workflows/apply-v099-ble-gatt.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: feature/v0.9.9-ble-gatt

      - name: Integrate BLE GATT UI
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('app/src/main/java/com/example/universalremote/MainActivity.kt')
          s = p.read_text()

          if 'import com.example.universalremote.control.BleGattController\n' not in s:
              s = s.replace(
                  'import com.example.universalremote.control.AndroidTvController\n',
                  'import com.example.universalremote.control.AndroidTvController\nimport com.example.universalremote.control.BleGattController\n',
                  1
              )

          if 'private lateinit var bleGatt: BleGattController' not in s:
              s = s.replace(
                  '    private lateinit var androidTv: AndroidTvController\n',
                  '    private lateinit var androidTv: AndroidTvController\n    private lateinit var bleGatt: BleGattController\n',
                  1
              )

          if 'bleGatt = BleGattController(this)' not in s:
              s = s.replace(
                  '        androidTv = AndroidTvController(this)\n',
                  '        androidTv = AndroidTvController(this)\n        bleGatt = BleGattController(this)\n',
                  1
              )

          old = '''        val healthButton = controlRow("🧪 Проверить стабильность службы") { runHealthProbe(currentDevice(initial.id)) }
          layout.addView(healthButton)
          val controlTestButton = controlRow("🔌 ПОДКЛЮЧИТЬСЯ • АВТО / PAIRING") { showConnectionOptions(currentDevice(initial.id)) }
          layout.addView(controlTestButton)
          '''
          new = '''        val healthButton = controlRow("🧪 Проверить стабильность службы") { runHealthProbe(currentDevice(initial.id)) }
          layout.addView(healthButton)
          val bleCandidate = isBleDevice(currentDevice(initial.id))
          val controlTestButton = controlRow(if (bleCandidate) "🟦 BLE GATT / СОПРЯЖЕНИЕ" else "🔌 ПОДКЛЮЧИТЬСЯ • АВТО / PAIRING") {
              val current = currentDevice(initial.id)
              if (isBleDevice(current)) showBleGattPanel(current) else showConnectionOptions(current)
          }
          layout.addView(controlTestButton)
          '''
          if old not in s:
              raise SystemExit('showDevice control marker not found')
          s = s.replace(old, new, 1)

          old_enable = '            controlTestButton.isEnabled = hostOf(d0.address) != null || d0.ipAddress != null\n'
          new_enable = '            controlTestButton.isEnabled = isBleDevice(d0) || hostOf(d0.address) != null || d0.ipAddress != null\n'
          if old_enable not in s:
              raise SystemExit('control enable marker not found')
          s = s.replace(old_enable, new_enable, 1)

          marker = '    private fun currentDevice(id: String): NearbyDevice = devices[id] ?: NearbyDevice(id, "Устройство", "Неизвестно", "", "")\n\n'
          if marker not in s:
              raise SystemExit('currentDevice marker not found')

          ble_ui = r'''    private fun isBleDevice(d: NearbyDevice): Boolean =
          d.id.startsWith("ble:", true) || d.protocol.contains("Bluetooth LE", true)

          private fun bleAddress(d: NearbyDevice): String? {
              val mac = Regex("(?i)^[0-9A-F]{2}(:[0-9A-F]{2}){5}$")
              return listOf(d.macAddress, d.address, d.id.removePrefix("ble:"))
                  .firstOrNull { value -> value != null && mac.matches(value) }
          }

          private fun showBleGattPanel(d: NearbyDevice) {
              val address = bleAddress(d) ?: return toast("BLE MAC не определён")
              val scroll = ScrollView(this)
              val layout = LinearLayout(this).apply {
                  orientation = LinearLayout.VERTICAL
                  setPadding(dp(18), dp(8), dp(18), dp(8))
              }
              val status = text(
                  "BLE: $address\n\nGATT ещё не проверен. Сначала прочитайте сервисы. Если характеристика требует шифрование, используйте штатное Android Bluetooth pairing.",
                  13f,
                  Color.WHITE,
                  false
              ).apply { setTextIsSelectable(true) }
              layout.addView(status)
              layout.addView(controlRow("🔎 ПОДКЛЮЧИТЬСЯ И ПРОЧИТАТЬ GATT") {
                  status.text = "⏳ Подключение к $address и discoverServices()…"
                  bleGatt.inspect(address) { result ->
                      runOnUiThread {
                          status.text = formatBleGattInspection(result)
                          val current = devices[d.id]
                          if (current != null) {
                              devices[d.id] = current.copy(
                                  analysisNote = if (result.ok) result.message else "${current.analysisNote ?: ""} • ${result.message}".trim(' ', '•')
                              )
                              scheduleRender()
                          }
                      }
                  }
              })
              layout.addView(controlRow("🔐 ШТАТНОЕ BLUETOOTH-СОПРЯЖЕНИЕ") {
                  status.text = "⏳ Android запускает штатное Bluetooth pairing. Подтвердите PIN/код на системном экране и на устройстве, если он появится."
                  bleGatt.requestBond(address) { ok, message ->
                      runOnUiThread {
                          toast(message)
                          if (ok) {
                              status.text = "✓ $message\n\nТеперь нажмите «Подключиться и прочитать GATT» ещё раз: после bonding могут открыться защищённые сервисы."
                          } else if (!message.contains("отправлен", true)) {
                              status.text = "Pairing: $message"
                          }
                      }
                  }
              })
              layout.addView(text(
                  "UniversalRemote не пишет случайные байты в неизвестные vendor-характеристики. Для реального пульта нужен известный формат команд конкретного BLE-протокола. Стандартные и vendor UUID теперь определяются автоматически, а pairing выполняет Android.",
                  12f,
                  c("#AABBD4"),
                  false
              ).apply { setPadding(0, dp(10), 0, 0) })
              scroll.addView(layout)
              AlertDialog.Builder(this)
                  .setTitle("BLE GATT • ${d.name}")
                  .setView(scroll)
                  .setNegativeButton("Закрыть", null)
                  .show()
          }

          private fun formatBleGattInspection(result: BleGattController.InspectionResult): String = buildString {
              appendLine(if (result.ok) "✓ ${result.message}" else "✗ ${result.message}")
              appendLine("Адрес: ${result.address}")
              appendLine("Имя: ${result.deviceName ?: "—"}")
              appendLine("Pairing/bond: ${result.bondState}")
              if (!result.ok) return@buildString
              appendLine()
              appendLine("GATT-сервисы:")
              result.services.take(32).forEach { service ->
                  appendLine()
                  appendLine("${if (service.primary) "PRIMARY" else "SECONDARY"} • ${service.name}")
                  appendLine(service.uuid)
                  service.characteristics.take(32).forEach { ch ->
                      append("  ↳ ${ch.name} • ${ch.properties.ifEmpty { listOf("без известных свойств") }.joinToString("/")}")
                      appendLine("\n     ${ch.uuid}")
                  }
              }
              if (result.services.size > 32) appendLine("\n… ещё ${result.services.size - 32} сервис(ов)")
              val knownControl = result.services.filter { it.name in setOf("Immediate Alert", "Human Interface Device", "Media Control", "Generic Media Control") }
              if (knownControl.isNotEmpty()) {
                  appendLine()
                  appendLine("Известные стандартные профили: ${knownControl.joinToString { it.name }}")
              }
          }.trim()

          '''
          s = s.replace(marker, marker + ble_ui, 1)

          old_connection = '''    private fun showConnectionOptions(d: NearbyDevice) {
          val host = d.ipAddress ?: hostOf(d.address) ?: return showPairingInfo(d)
          '''
          new_connection = '''    private fun showConnectionOptions(d: NearbyDevice) {
          if (isBleDevice(d)) return showBleGattPanel(d)
          val host = d.ipAddress ?: hostOf(d.address) ?: return showPairingInfo(d)
          '''
          if old_connection not in s:
              raise SystemExit('showConnectionOptions marker not found')
          s = s.replace(old_connection, new_connection, 1)

          old_destroy = '        stopScan(); upnp.close(); pjlink.close(); roku.close(); samsung.close(); wled.close(); cast.close(); yeelight.close(); lgWebOs.close(); hue.close(); androidTv.close(); analyzer.close(); wol.close(); healthProbe.close()\n'
          new_destroy = '        stopScan(); upnp.close(); pjlink.close(); roku.close(); samsung.close(); wled.close(); cast.close(); yeelight.close(); lgWebOs.close(); hue.close(); androidTv.close(); bleGatt.close(); analyzer.close(); wol.close(); healthProbe.close()\n'
          if old_destroy not in s:
              raise SystemExit('onDestroy marker not found')
          s = s.replace(old_destroy, new_destroy, 1)

          p.write_text(s)
          PY

      - name: Commit source integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "UniversalRemote CI"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/java/com/example/universalremote/MainActivity.kt
          git commit -m "Integrate BLE GATT inspector and pairing UI"
          git push origin HEAD:feature/v0.9.9-ble-gatt
