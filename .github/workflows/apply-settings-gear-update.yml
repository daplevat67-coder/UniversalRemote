name: Apply settings gear update

on:
  push:
    branches: [ ui/settings-gear-auth-hub ]
    paths:
      - ".github/workflows/apply-settings-gear-update.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ui/settings-gear-auth-hub

      - name: Consolidate settings and auth UI
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/src/main/java/com/example/universalremote/MainActivity.kt")
          lines = path.read_text().splitlines()

          def find_line(needle, start=0):
              for i in range(start, len(lines)):
                  if needle in lines[i]:
                      return i
              raise SystemExit(f"marker not found: {needle}")

          # Header -> title + one gear button.
          start = find_line('root.addView(text("UNIVERSAL REMOTE • v${BuildConfig.VERSION_NAME}"')
          end = find_line('val radar = LinearLayout(this)', start)
          header = [
              '        val header = LinearLayout(this).apply {',
              '            orientation = LinearLayout.HORIZONTAL',
              '            gravity = Gravity.CENTER_VERTICAL',
              '        }',
              '        val titleBox = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }',
              '        titleBox.addView(text("UNIVERSAL REMOTE • v${BuildConfig.VERSION_NAME}", 12f, c("#65E6C4"), true).apply { letterSpacing = .12f })',
              '        titleBox.addView(text("Устройства рядом", 30f, Color.WHITE, true).apply { setPadding(0, dp(5), 0, dp(4)) })',
              '        header.addView(titleBox, LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f))',
              '        header.addView(smallButton("⚙") { showSettingsHub() }, LinearLayout.LayoutParams(dp(52), dp(48)).apply { marginStart = dp(10) })',
              '        root.addView(header)',
              '        root.addView(text("Автоподключение по штатным LAN API • пароль/PIN используется только там, где протокол его реально поддерживает", 13f, c("#AABBD4"), false))',
              '',
          ]
          lines[start:end] = header

          # Remove the row of separate settings/help buttons.
          start = find_line('val tools = LinearLayout(this)')
          end = find_line('search = EditText(this)', start)
          lines[start:end] = []

          # Add a single settings hub before the existing filters function.
          insert_at = find_line('private fun showFilters()')
          hub = '''    private fun showSettingsHub() {
              val items = arrayOf(
                  "🔎 Фильтры устройств",
                  "📡 Настройки сканера",
                  "🔌 Подключение по IP / пароль / pairing",
                  "🧪 Диагностика поиска",
                  "📱 Android Companion",
                  "🍎 iPhone / iPad",
                  "♻ Сбросить поиск и источники"
              )
              AlertDialog.Builder(this)
                  .setTitle("⚙ Настройки")
                  .setItems(items) { _, which ->
                      when (which) {
                          0 -> showFilters()
                          1 -> showSettings()
                          2 -> showManualControl()
                          3 -> showDiscoveryDiagnostics()
                          4 -> showCompanionHelp()
                          5 -> showIosHelp()
                          6 -> {
                              prefs.edit()
                                  .putString("ip_range", "auto")
                                  .putInt("connect_timeout", 300)
                                  .putInt("parallelism", 32)
                                  .putBoolean("ble", true)
                                  .putBoolean("classic", true)
                                  .putBoolean("wifi_radio", true)
                                  .putBoolean("mdns", true)
                                  .putBoolean("ssdp", true)
                                  .putBoolean("lan", true)
                                  .putBoolean("pjlink", true)
                                  .putBoolean("yeelight", true)
                                  .apply()
                              requestAndScan()
                          }
                      }
                  }
                  .setNegativeButton("Закрыть", null)
                  .show()
          }
          '''.splitlines()
          lines[insert_at:insert_at] = hub + ['']

          text = '\n'.join(lines) + '\n'
          text = text.replace('"Авто — подключиться доступным штатным способом"', '"⚡ Авто — без пароля, если API это разрешает"', 1)
          text = text.replace('"Штатная авторизация — PIN / код / подтверждение"', '"🔐 Пароль / PIN / код / pairing — штатная авторизация"', 1)
          text = text.replace('"PJLink — пароль только на текущую команду"', '"🎥 PJLink — пароль проектора"', 1)
          text = text.replace(
              '"Без пароля UniversalRemote подключается только к тем локальным API, которые производитель сам оставил без авторизации. " +\n                    "Если устройство требует PIN, пароль, кнопку на корпусе или подтверждение на экране, используется только этот штатный способ. " +\n                    "Пароли и PIN блокировки не подбираются и не обходятся."',
              '"Если вы знаете пароль или код, UniversalRemote использует его только в штатном протоколе этого устройства. " +\n                    "Один пароль не является универсальным ключом: разные устройства используют разные API и способы pairing. " +\n                    "Подбор, обход PIN и отключение защиты не выполняются."',
              1
          )
          text = text.replace(
              '.setPositiveButton("Варианты подключения") { _, _ -> d?.let(::showConnectionOptions) }',
              '.setPositiveButton("Подключение / пароль") { _, _ -> d?.let(::showConnectionOptions) }',
              1
          )
          path.write_text(text)
          PY

      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-settings-gear-update.yml
          git config user.name "UniversalRemote CI"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/java/com/example/universalremote/MainActivity.kt .github/workflows/apply-settings-gear-update.yml
          git commit -m "Consolidate settings into gear and credential hub"
          git push origin HEAD:ui/settings-gear-auth-hub
