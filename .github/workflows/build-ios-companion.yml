name: Build iOS Companion IPA

on:
  workflow_dispatch:
    inputs:
      upload_to_testflight:
        description: "Upload signed IPA to TestFlight"
        required: true
        default: true
        type: boolean
  push:
    branches: [ main, master ]
    paths:
      - "ios-companion/**"
      - ".github/workflows/build-ios-companion.yml"

permissions:
  contents: read

env:
  VERSION: 0.9.2
  IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
  IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
  IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
  IOS_MOBILEPROVISION_BASE64: ${{ secrets.IOS_MOBILEPROVISION_BASE64 }}
  ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
  ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
  ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios-companion
        run: xcodegen generate

      - name: Compile for iOS Simulator (unsigned check)
        working-directory: ios-companion
        run: |
          set -euo pipefail
          xcodebuild \
            -project UniversalRemoteIOSCompanion.xcodeproj \
            -scheme UniversalRemoteIOSCompanion \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/ios-simulator-derived" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Check whether signing is configured
        id: signing
        shell: bash
        run: |
          if [[ -n "$IOS_BUNDLE_ID" && -n "$IOS_P12_BASE64" && -n "$IOS_P12_PASSWORD" && -n "$IOS_MOBILEPROVISION_BASE64" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Signing secrets are not configured; simulator compile-check succeeded, signed IPA skipped."
          fi

      - name: Import Apple Distribution certificate and provisioning profile
        if: steps.signing.outputs.ready == 'true'
        id: apple_signing
        shell: bash
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/universalremote-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          P12="$RUNNER_TEMP/distribution.p12"
          PROFILE="$RUNNER_TEMP/profile.mobileprovision"
          PROFILE_PLIST="$RUNNER_TEMP/profile.plist"

          printf '%s' "$IOS_P12_BASE64" | base64 --decode > "$P12"
          printf '%s' "$IOS_MOBILEPROVISION_BASE64" | base64 --decode > "$PROFILE"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$P12" -P "$IOS_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          security cms -D -i "$PROFILE" > "$PROFILE_PLIST"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$PROFILE_PLIST")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$PROFILE_PLIST")
          TEAM_ID=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$PROFILE_PLIST")
          PROFILE_APP_ID=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$PROFILE_PLIST")
          PROFILE_BUNDLE_ID="${PROFILE_APP_ID#*.}"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          if [[ "$PROFILE_BUNDLE_ID" != "$IOS_BUNDLE_ID" && "$PROFILE_BUNDLE_ID" != "*" ]]; then
            echo "Provisioning profile bundle id '$PROFILE_BUNDLE_ID' does not match IOS_BUNDLE_ID '$IOS_BUNDLE_ID'." >&2
            exit 1
          fi

          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | sed -n 's/.*"\(.*\)"/\1/p' | head -n 1)
          test -n "$IDENTITY"

          echo "keychain=$KEYCHAIN" >> "$GITHUB_OUTPUT"
          echo "profile_name=$PROFILE_NAME" >> "$GITHUB_OUTPUT"
          echo "team_id=$TEAM_ID" >> "$GITHUB_OUTPUT"
          echo "identity=$IDENTITY" >> "$GITHUB_OUTPUT"

      - name: Archive signed iPhone/iPad app
        if: steps.signing.outputs.ready == 'true'
        working-directory: ios-companion
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project UniversalRemoteIOSCompanion.xcodeproj \
            -scheme UniversalRemoteIOSCompanion \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/UniversalRemoteIOSCompanion.xcarchive" \
            PRODUCT_BUNDLE_IDENTIFIER="$IOS_BUNDLE_ID" \
            DEVELOPMENT_TEAM="${{ steps.apple_signing.outputs.team_id }}" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="${{ steps.apple_signing.outputs.identity }}" \
            PROVISIONING_PROFILE_SPECIFIER="${{ steps.apple_signing.outputs.profile_name }}" \
            archive

      - name: Export signed IPA for App Store Connect / TestFlight
        if: steps.signing.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>${{ steps.apple_signing.outputs.team_id }}</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${IOS_BUNDLE_ID}</key><string>${{ steps.apple_signing.outputs.profile_name }}</string>
            </dict>
            <key>stripSwiftSymbols</key><true/>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST

          mkdir -p "$RUNNER_TEMP/ipa-export" dist/ios
          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/UniversalRemoteIOSCompanion.xcarchive" \
            -exportPath "$RUNNER_TEMP/ipa-export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

          IPA=$(find "$RUNNER_TEMP/ipa-export" -maxdepth 1 -name '*.ipa' -print -quit)
          test -n "$IPA"
          cp "$IPA" "dist/ios/UniversalRemote-iOS-Companion-v${VERSION}.ipa"
          shasum -a 256 "dist/ios/UniversalRemote-iOS-Companion-v${VERSION}.ipa" > dist/ios/SHA256SUMS.txt

      - name: Upload signed IPA artifact
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: UniversalRemote-iOS-Companion-v0.9.2-IPA
          if-no-files-found: error
          retention-days: 30
          path: dist/ios/

      - name: Check TestFlight credentials
        if: steps.signing.outputs.ready == 'true' && github.event_name == 'workflow_dispatch' && inputs.upload_to_testflight
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ASC_KEY_ID" || (echo "Missing ASC_KEY_ID" >&2; exit 1)
          test -n "$ASC_ISSUER_ID" || (echo "Missing ASC_ISSUER_ID" >&2; exit 1)
          test -n "$ASC_PRIVATE_KEY_BASE64" || (echo "Missing ASC_PRIVATE_KEY_BASE64" >&2; exit 1)

      - name: Upload to TestFlight
        if: steps.signing.outputs.ready == 'true' && github.event_name == 'workflow_dispatch' && inputs.upload_to_testflight
        shell: bash
        run: |
          set -euo pipefail
          KEY_DIR="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$KEY_DIR"
          printf '%s' "$ASC_PRIVATE_KEY_BASE64" | base64 --decode > "$KEY_DIR/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$KEY_DIR/AuthKey_${ASC_KEY_ID}.p8"

          xcrun altool \
            --upload-app \
            --type ios \
            --file "dist/ios/UniversalRemote-iOS-Companion-v${VERSION}.ipa" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

      - name: Signing setup reminder
        if: steps.signing.outputs.ready != 'true'
        shell: bash
        run: |
          cat <<'EOF'
          iOS source compiled for Simulator successfully.
          To produce an installable IPA, add these repository secrets:
          IOS_BUNDLE_ID
          IOS_P12_BASE64
          IOS_P12_PASSWORD
          IOS_MOBILEPROVISION_BASE64
          For TestFlight also add:
          ASC_KEY_ID
          ASC_ISSUER_ID
          ASC_PRIVATE_KEY_BASE64
          EOF
