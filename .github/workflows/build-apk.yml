name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION: 0.9.2
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.10.2"

      - name: Lint and unit tests
        run: gradle :app:lintDebug :companion:lintDebug :app:testDebugUnitTest

      - name: Build installable debug APKs
        run: gradle :app:assembleDebug :companion:assembleDebug

      - name: Prepare named debug APKs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/android
          cp app/build/outputs/apk/debug/app-debug.apk \
            "dist/android/UniversalRemote-v${VERSION}.apk"
          cp companion/build/outputs/apk/debug/companion-debug.apk \
            "dist/android/UniversalRemote-Companion-v${VERSION}.apk"
          sha256sum dist/android/*.apk > dist/android/SHA256SUMS.txt

      - name: Upload installable APKs
        uses: actions/upload-artifact@v6
        with:
          name: UniversalRemote-v0.9.2-APKs
          if-no-files-found: error
          retention-days: 30
          path: dist/android/

      - name: Prepare release signing key
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        shell: bash
        run: |
          set -euo pipefail
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/universalremote-release.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/universalremote-release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APKs
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: gradle :app:assembleRelease :companion:assembleRelease

      - name: Prepare named signed release APKs
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/android-release
          cp app/build/outputs/apk/release/app-release.apk \
            "dist/android-release/UniversalRemote-v${VERSION}-release.apk"
          cp companion/build/outputs/apk/release/companion-release.apk \
            "dist/android-release/UniversalRemote-Companion-v${VERSION}-release.apk"
          sha256sum dist/android-release/*.apk > dist/android-release/SHA256SUMS.txt

      - name: Upload signed release APKs
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        uses: actions/upload-artifact@v6
        with:
          name: UniversalRemote-v0.9.2-signed-release-APKs
          if-no-files-found: error
          retention-days: 30
          path: dist/android-release/
