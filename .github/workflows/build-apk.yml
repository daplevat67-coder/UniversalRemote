name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.10.2"

      - name: Lint and unit tests
        run: gradle :app:lintDebug :companion:lintDebug :app:testDebugUnitTest

      - name: Build debug APKs
        run: gradle :app:assembleDebug :companion:assembleDebug

      - name: Prepare release signing key
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/universalremote-release.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/universalremote-release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APKs
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: gradle :app:assembleRelease :companion:assembleRelease

      - name: Upload debug APKs
        uses: actions/upload-artifact@v6
        with:
          name: UniversalRemote-v0.8.1-debug-apks
          if-no-files-found: error
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            companion/build/outputs/apk/debug/companion-debug.apk

      - name: Upload signed release APKs
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        uses: actions/upload-artifact@v6
        with:
          name: UniversalRemote-v0.8.1-release-apks
          if-no-files-found: error
          path: |
            app/build/outputs/apk/release/app-release.apk
            companion/build/outputs/apk/release/companion-release.apk
