name: Build Android Store Artifacts

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master, release/v0.9.7-store-rc ]
    paths:
      - "app/**"
      - "companion/**"
      - ".github/workflows/build-apk.yml"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION: 0.9.9
      ANDROID_APPLICATION_ID: ${{ vars.ANDROID_APPLICATION_ID }}
      ANDROID_COMPANION_APPLICATION_ID: ${{ vars.ANDROID_COMPANION_APPLICATION_ID }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "17"

      - name: Ensure Android API 36 SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER=$(find "${ANDROID_HOME}/cmdline-tools" -type f -name sdkmanager -perm -111 -print -quit)
          fi
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          gradle-version: "8.11.1"
          cache-cleanup: always

      - name: Quality gates
        run: gradle :app:lintDebug :companion:lintDebug :app:testDebugUnitTest :companion:testDebugUnitTest

      - name: Build verified debug APKs
        run: gradle :app:assembleDebug :companion:assembleDebug

      - name: Prepare verified debug APKs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/android-debug
          cp app/build/outputs/apk/debug/app-debug.apk \
            "dist/android-debug/UniversalRemote-v${VERSION}.apk"
          cp companion/build/outputs/apk/debug/companion-debug.apk \
            "dist/android-debug/UniversalRemote-Companion-v${VERSION}.apk"
          sha256sum dist/android-debug/*.apk > dist/android-debug/SHA256SUMS.txt

      - name: Upload verified debug APKs
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: UniversalRemote-v0.9.9-verified-debug-APKs
          if-no-files-found: error
          retention-days: 30
          path: dist/android-debug/

      - name: Check store identity and Android release signing
        id: android_signing
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$ANDROID_APPLICATION_ID" || -z "$ANDROID_COMPANION_APPLICATION_ID" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Store AAB skipped: set repository variables ANDROID_APPLICATION_ID and ANDROID_COMPANION_APPLICATION_ID before first Play listing." >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$ANDROID_APPLICATION_ID" == com.example.* || "$ANDROID_COMPANION_APPLICATION_ID" == com.example.* ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Store AAB skipped: com.example.* is a development placeholder; choose final package IDs first." >> "$GITHUB_STEP_SUMMARY"
          elif [[ -n "$ANDROID_KEYSTORE_BASE64" && -n "$ANDROID_KEY_ALIAS" && -n "$ANDROID_KEYSTORE_PASSWORD" && -n "$ANDROID_KEY_PASSWORD" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Android store identity/signing: configured" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Android store AAB skipped: release upload-key secrets are incomplete." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Prepare Android upload key
        if: steps.android_signing.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/universalremote-release.jks"
          chmod 600 "$RUNNER_TEMP/universalremote-release.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/universalremote-release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK and AAB
        if: steps.android_signing.outputs.ready == 'true'
        run: gradle :app:assembleRelease :app:bundleRelease :companion:assembleRelease :companion:bundleRelease

      - name: Prepare Google Play and GitHub release artifacts
        if: steps.android_signing.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/android-release
          cp app/build/outputs/apk/release/app-release.apk \
            "dist/android-release/UniversalRemote-v${VERSION}-release.apk"
          cp app/build/outputs/bundle/release/app-release.aab \
            "dist/android-release/UniversalRemote-v${VERSION}-release.aab"
          cp companion/build/outputs/apk/release/companion-release.apk \
            "dist/android-release/UniversalRemote-Companion-v${VERSION}-release.apk"
          cp companion/build/outputs/bundle/release/companion-release.aab \
            "dist/android-release/UniversalRemote-Companion-v${VERSION}-release.aab"
          sha256sum dist/android-release/* > dist/android-release/SHA256SUMS.txt
          echo "Google Play AAB: UniversalRemote-v${VERSION}-release.aab" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload signed store artifacts
        if: steps.android_signing.outputs.ready == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: UniversalRemote-v0.9.9-signed-store-artifacts
          if-no-files-found: error
          retention-days: 30
          path: dist/android-release/

      - name: Secret-file hygiene check
        shell: bash
        run: |
          set -euo pipefail
          forbidden=$(git ls-files | grep -Ei '\.(jks|keystore|p12|p8|mobileprovision)$|(^|/)\.env($|\.)' || true)
          if [[ -n "$forbidden" ]]; then
            echo "Tracked secret-like files detected:" >&2
            echo "$forbidden" >&2
            exit 1
          fi

      - name: Cleanup Android signing material
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/universalremote-release.jks"