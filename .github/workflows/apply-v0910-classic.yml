name: Apply v0.9.10 Bluetooth Classic fix

on:
  push:
    branches: [ fix/v0.9.10-bluetooth-classic ]
    paths:
      - ".github/workflows/apply-v0910-classic.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: fix/v0.9.10-bluetooth-classic

      - name: Patch Bluetooth Classic flow
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/patch.py
          python3 /tmp/patch.py

      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-v0910-classic.yml
          git config user.name "UniversalRemote CI"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/java/com/example/universalremote/MainActivity.kt app/build.gradle.kts companion/build.gradle.kts .github/workflows/build-apk.yml .github/workflows/apply-v0910-classic.yml
          git commit -m "Fix Bluetooth Classic pairing flow in v0.9.10"
          git push origin HEAD:fix/v0.9.10-bluetooth-classic
