name: UniversalRemoteIOSCompanion
options:
  bundleIdPrefix: com.example.universalremote
  deploymentTarget:
    iOS: "16.0"
targets:
  UniversalRemoteIOSCompanion:
    type: application
    platform: iOS
    sources:
      - UniversalRemoteIOSCompanion
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.universalremote.ioscompanion
        PRODUCT_NAME: UniversalRemote iOS Companion
        SWIFT_VERSION: 5.9
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 20
        MARKETING_VERSION: 0.9.7
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: UniversalRemoteIOSCompanion/Info.plist
    scheme:
      testTargets:
        - UniversalRemoteIOSCompanionTests

  UniversalRemoteIOSCompanionTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - UniversalRemoteIOSCompanionTests
    dependencies:
      - target: UniversalRemoteIOSCompanion
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.universalremote.ioscompanion.tests
        SWIFT_VERSION: 5.9
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/UniversalRemote iOS Companion.app/UniversalRemote iOS Companion"
        BUNDLE_LOADER: "$(TEST_HOST)"
